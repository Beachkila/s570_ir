<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>S570 IR Correction</title>
<style>
:root{--bg:#151515;--panel:#202020;--line:#343434;--text:#e8e6e1;--dim:#9a9791;--acc:#d9d3c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
button,select,input[type=text],.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;min-height:42px;touch-action:manipulation}
button:active,.btn:active{background:#2e2e2e}
button.on{background:var(--acc);color:#151515;border-color:var(--acc)}
button:disabled{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
input[type=file]{display:none}
#top{display:flex;gap:6px;padding:8px;align-items:center;flex:none}
#top select{flex:1;min-width:0;height:42px}
#top #more{width:42px;padding:0}
#export{background:var(--acc);color:#151515;border-color:var(--acc);font-weight:600;min-width:78px}
#view{position:relative;flex:0 0 46%;overflow:hidden;background:#0b0b0b;touch-action:none;-webkit-user-select:none;user-select:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#cv,#ov{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim)}
#empty[hidden]{display:none}
#empty .btn{min-height:50px;padding:0 26px;font-weight:600;background:var(--acc);color:#151515;border-color:var(--acc)}
.ui{touch-action:manipulation}
#tools{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}
#tools .seg{display:flex;flex:1}
#tools button{background:rgba(24,24,24,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#tools .seg button{flex:1;border-radius:0;margin-left:-1px;padding:0 4px}
#tools .seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}
#tools .seg button:last-child{border-radius:0 10px 10px 0}
#tools button.on{background:var(--acc)}
#before{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#healbar{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center;background:rgba(24,24,24,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
#healbar[hidden]{display:none}
#healbar input{flex:1;min-width:0;accent-color:var(--acc)}
#healbar button{min-height:36px;padding:0 10px;font-size:14px}
#healbar .cnt{color:var(--dim);font-size:12px;min-width:44px;text-align:right}
#toast{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);max-width:92%;background:rgba(0,0,0,.78);color:var(--text);padding:7px 12px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;min-height:38px;border-radius:19px;padding:0 16px;font-size:15px}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(18px + env(safe-area-inset-bottom));min-height:0}
.hint{color:var(--dim);font-size:13px;margin:2px 0 6px}
.sl{margin:6px 0 2px}
.sl .t{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:14px}
.sl .v{background:none;border:none;color:var(--text);min-height:32px;min-width:64px;padding:0 0 0 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.sl .v.mod{color:var(--acc)}
.sl .v.mod::before{content:"↺ ";color:var(--dim)}
.sl input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--acc);touch-action:pan-y}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:10}
#sheet[hidden]{display:none}
#sheet .card{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
#sheet h2{font-size:16px;margin:0 0 10px}
#sheet .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
#sheet input[type=text]{flex:1;min-width:0}
</style>
</head>
<body>
<header id="top">
  <label class="btn" for="file">Load</label><input id="file" type="file" accept="image/*">
  <select id="presetSel" aria-label="Preset"></select>
  <button id="more" aria-label="More">⋯</button>
  <button id="export" disabled>Export</button>
</header>

<section id="view">
  <canvas id="cv" hidden></canvas>
  <canvas id="ov" hidden></canvas>
  <div id="empty" class="ui"><label class="btn" for="file">Load a JPG</label><div>Straight from the camera</div></div>
  <div id="toast"></div>
  <div id="healbar" class="ui" hidden>
    <span style="font-size:13px;color:var(--dim)">Brush</span>
    <input id="hs" type="range" min="4" max="50" step="1" value="14" aria-label="Brush size">
    <button id="hundo">Undo</button><button id="hclr">Clear</button><span id="hcount" class="cnt">0</span>
  </div>
  <div id="tools" class="ui">
    <div class="seg" id="modes">
      <button data-m="view" class="on">View</button>
      <button data-m="pick">Neutral</button>
      <button data-m="heal">Heal dust</button>
    </div>
    <button id="before">Before</button>
  </div>
</section>

<nav id="tabs"></nav>
<main id="panel"></main>

<div id="sheet" hidden>
  <div class="card">
    <h2>Presets &amp; more</h2>
    <div class="row"><input id="pname" type="text" placeholder="Name for current settings"><button id="psave">Save</button></div>
    <div class="row">
      <button id="pdel">Delete selected</button>
      <button id="pexp">Export JSON</button>
      <label class="btn" for="pimp">Import JSON</label><input id="pimp" type="file" accept=".json,application/json">
    </div>
    <div class="row"><button id="preset0">Reset all sliders</button><button id="sclose" style="margin-left:auto">Close</button></div>
    <div class="hint">Presets hold every slider but not dust spots. Tap a slider's value to reset it. Pinch the photo to zoom, drag to pan.</div>
  </div>
</div>

<script>
// ==CORE==
const BASE=1600;
const DEF={m0:1,m1:0,m2:0,m3:0,m4:1,m5:0,m6:0,m7:0,m8:1,
  gR:1,gG:1,gB:1,temp:0,tint:0,exp:0,con:0,sat:100,
  vig:0,vigSpread:50,vigColor:0,vigX:0,vigY:0,
  dist:0,dn:0,sh:0,shR:2};
const BUILTIN={
 'S570 IR · Blue/Gold':{m0:1.6,m1:1.2,m2:-1.3,m3:1.0,m4:0.1,m5:0,m6:-0.2,m7:-1.9,m8:2.2,dn:25,sh:35},
 'S570 IR · Neutral':{gR:0.72,gG:1.28,gB:0.95,dn:15,sh:30},
 'S570 IR · Mono':{m0:0.6,m1:0.3,m2:0.1,m3:0.6,m4:0.3,m5:0.1,m6:0.6,m7:0.3,m8:0.1,con:10,dn:20,sh:30}
};

function boxBlur(src,w,h,r){
  r=Math.max(1,Math.round(r));
  const n=2*r+1, tmp=new Uint8ClampedArray(src.length), out=new Uint8ClampedArray(src.length);
  for(let y=0;y<h;y++){
    const row=y*w*4;
    for(let c=0;c<3;c++){
      let s=0;
      for(let k=-r;k<=r;k++) s+=src[row+Math.min(w-1,Math.max(0,k))*4+c];
      for(let x=0;x<w;x++){
        tmp[row+x*4+c]=s/n;
        s+=src[row+Math.min(w-1,x+r+1)*4+c]-src[row+Math.max(0,x-r)*4+c];
      }
    }
  }
  const st=w*4;
  for(let x=0;x<w;x++){
    for(let c=0;c<3;c++){
      const col=x*4+c;
      let s=0;
      for(let k=-r;k<=r;k++) s+=tmp[Math.min(h-1,Math.max(0,k))*st+col];
      for(let y=0;y<h;y++){
        out[y*st+col]=s/n;
        s+=tmp[Math.min(h-1,y+r+1)*st+col]-tmp[Math.max(0,y-r)*st+col];
      }
    }
  }
  return out;
}

function distort(src,w,h,k){
  const out=new Uint8ClampedArray(src.length);
  const cx=(w-1)/2, cy=(h-1)/2, R=Math.hypot(cx,cy);
  for(let y=0;y<h;y++){
    const ny=(y-cy)/R;
    for(let x=0;x<w;x++){
      const nx=(x-cx)/R, f=1+k*(nx*nx+ny*ny);
      let sx=cx+nx*f*R, sy=cy+ny*f*R;
      sx=Math.min(w-1,Math.max(0,sx)); sy=Math.min(h-1,Math.max(0,sy));
      const x0=Math.floor(sx), y0=Math.floor(sy), x1=Math.min(w-1,x0+1), y1=Math.min(h-1,y0+1);
      const fx=sx-x0, fy=sy-y0;
      const i00=(y0*w+x0)*4, i10=(y0*w+x1)*4, i01=(y1*w+x0)*4, i11=(y1*w+x1)*4, o=(y*w+x)*4;
      for(let c=0;c<3;c++){
        const top=src[i00+c]+(src[i10+c]-src[i00+c])*fx;
        const bot=src[i01+c]+(src[i11+c]-src[i01+c])*fx;
        out[o+c]=top+(bot-top)*fy;
      }
      out[o+3]=255;
    }
  }
  return out;
}

function heal(a,w,h,spots){
  for(const s of spots){
    const R=s.r*w, cx=s.x*w, cy=s.y*h;
    const rs=[[],[],[]], fill=[0,0,0];
    for(const k of [1.7,2.4]) for(let j=0;j<16;j++){
      const t=j/16*6.2832+(k>2?0.2:0);
      let x=Math.round(cx+Math.cos(t)*R*k), y=Math.round(cy+Math.sin(t)*R*k);
      x=Math.min(w-1,Math.max(0,x)); y=Math.min(h-1,Math.max(0,y));
      const i=(y*w+x)*4;
      rs[0].push(a[i]); rs[1].push(a[i+1]); rs[2].push(a[i+2]);
    }
    for(let c=0;c<3;c++){ rs[c].sort((p,q)=>p-q); fill[c]=(rs[c][15]+rs[c][16])/2; }
    const fl=.299*fill[0]+.587*fill[1]+.114*fill[2];
    const ext=R*1.35;
    const x0=Math.max(0,Math.floor(cx-ext)), x1=Math.min(w-1,Math.ceil(cx+ext));
    const y0=Math.max(0,Math.floor(cy-ext)), y1=Math.min(h-1,Math.ceil(cy+ext));
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const d=Math.hypot(x-cx,y-cy);
      if(d>ext) continue;
      let wg=d<=R?1:1-(d-R)/(ext-R);
      wg=wg*wg*(3-2*wg);
      const i=(y*w+x)*4;
      const pl=.299*a[i]+.587*a[i+1]+.114*a[i+2];
      if(fl<=pl) continue;   // dust is darker than its surroundings: only lighten
      for(let c=0;c<3;c++) a[i+c]=a[i+c]+(fill[c]-a[i+c])*wg;
    }
  }
}

function mixPx(p,r,g,b){
  return [p.m0*r+p.m1*g+p.m2*b, p.m3*r+p.m4*g+p.m5*b, p.m6*r+p.m7*g+p.m8*b];
}

function colorStage(a,w,h,p){
  const gr=p.gR*(1+p.temp/200), gg=p.gG*(1-p.tint/200), gb=p.gB*(1-p.temp/200);
  const ex=Math.pow(2,p.exp), cf=1+p.con/100, sat=p.sat/100;
  const useV=p.vig!==0;
  const cx=w/2+p.vigX/100*w/2, cy=h/2+p.vigY/100*h/2;
  const norm=Math.hypot(Math.max(cx,w-cx),Math.max(cy,h-cy))||1;
  const pw=4-3*(p.vigSpread/100);
  const sR=p.vig/100*(1+p.vigColor/100), sG=p.vig/100, sB=p.vig/100*(1-p.vigColor/100);
  const m0=p.m0,m1=p.m1,m2=p.m2,m3=p.m3,m4=p.m4,m5=p.m5,m6=p.m6,m7=p.m7,m8=p.m8;
  for(let y=0;y<h;y++){
    const dy=(y-cy)*(y-cy);
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const r=a[i],g=a[i+1],b=a[i+2];
      let R=(m0*r+m1*g+m2*b)*gr*ex, G=(m3*r+m4*g+m5*b)*gg*ex, B=(m6*r+m7*g+m8*b)*gb*ex;
      if(useV){
        const f=Math.pow(Math.sqrt((x-cx)*(x-cx)+dy)/norm,pw);
        R*=Math.max(.05,1+sR*f); G*=Math.max(.05,1+sG*f); B*=Math.max(.05,1+sB*f);
      }
      if(cf!==1){R=(R-128)*cf+128;G=(G-128)*cf+128;B=(B-128)*cf+128;}
      if(sat!==1){const l=.299*R+.587*G+.114*B;R=l+(R-l)*sat;G=l+(G-l)*sat;B=l+(B-l)*sat;}
      a[i]=R;a[i+1]=G;a[i+2]=B;
    }
  }
}

function detailStage(a,w,h,p,scale){
  if(p.dn>0){
    const bl=boxBlur(a,w,h,Math.max(1,scale)), k=p.dn/100;
    for(let i=0;i<a.length;i+=4){
      a[i]+=(bl[i]-a[i])*k; a[i+1]+=(bl[i+1]-a[i+1])*k; a[i+2]+=(bl[i+2]-a[i+2])*k;
    }
  }
  if(p.sh>0){
    const bl=boxBlur(a,w,h,Math.max(1,p.shR*scale)), k=p.sh/100;
    for(let i=0;i<a.length;i+=4){
      a[i]+=(a[i]-bl[i])*k; a[i+1]+=(a[i+1]-bl[i+1])*k; a[i+2]+=(a[i+2]-bl[i+2])*k;
    }
  }
}

function render(src,w,h,p,spots){
  const a=p.dist!==0?distort(src,w,h,p.dist/100):new Uint8ClampedArray(src);
  if(spots.length) heal(a,w,h,spots);
  colorStage(a,w,h,p);
  detailStage(a,w,h,p,Math.max(w,h)/BASE);
  return a;
}
// ==/CORE==

// ---------- UI ----------
const $=id=>document.getElementById(id);
const view=$('view'), cv=$('cv'), ov=$('ov');
const ctx=cv.getContext('2d',{willReadFrequently:true}), octx=ov.getContext('2d');
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FIRST='S570 IR · Blue/Gold';
let P=Object.assign({},DEF,BUILTIN[FIRST],LS.get('ir570.last')||{});
let user=LS.get('ir570.presets')||{};
let src=null,bmp=null,fileName='photo.jpg',spots=[],mode='view',healSize=14,showOrig=false;
let outBlob=null,outName='',ringUntil=0;

let tt=0;
function status(t){
  const el=$('toast'); if(!t){el.classList.remove('show');return;}
  el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2800);
}

// ----- groups / sliders -----
const MIX=['R','G','B'];
const GROUPS=[
 {tab:'Color',items:[
  ['temp','Temperature (− cooler, + warmer)',-100,100,1,0],['tint','Tint (− magenta, + green)',-100,100,1,0],
  ['gR','Red gain',0.25,3,0.01,2],['gG','Green gain',0.25,3,0.01,2],['gB','Blue gain',0.25,3,0.01,2],
  ['exp','Exposure (stops)',-2,2,0.05,2],['con','Contrast',-60,100,1,0],['sat','Saturation %',0,250,1,0]]},
 {tab:'Mixer',hint:'Each output channel is built from the camera\'s R, G and B. Blue/Gold uses a strong mix; Neutral is identity.',
  items:[0,1,2,3,4,5,6,7,8].map(i=>['m'+i,'Out '+MIX[Math.floor(i/3)]+' ← in '+MIX[i%3],-2.5,2.5,0.01,2])},
 {tab:'Vignette',hint:'Brightens the corners to cancel falloff. Use Color shift if the corners turn a different color than the center.',items:[
  ['vig','Corner brightening (− darkens)',-100,200,1,0],['vigSpread','Reach (edges only → toward center)',0,100,1,0],
  ['vigColor','Color shift (− blue edges, + red edges)',-100,100,1,0],['vigX','Center X',-50,50,1,0],['vigY','Center Y',-50,50,1,0]]},
 {tab:'Lens',items:[['dist','Distortion (− fixes barrel, + fixes pincushion)',-50,50,1,0]]},
 {tab:'Detail',items:[['dn','Noise reduction',0,100,1,0],['sh','Sharpen',0,200,1,0],['shR','Sharpen radius (px)',1,4,1,0]]}
];
const ui={}, tabsEl=$('tabs'), panel=$('panel'), pages=[];
GROUPS.forEach((g,gi)=>{
  const tb=document.createElement('button');tb.textContent=g.tab;tabsEl.appendChild(tb);
  const pg=document.createElement('div');pg.hidden=true;
  if(g.hint){const h=document.createElement('div');h.className='hint';h.textContent=g.hint;pg.appendChild(h);}
  for(const [k,label,mn,mx,st,dec] of g.items){
    const s=document.createElement('div');s.className='sl';
    s.innerHTML='<div class="t"><span></span><button class="v"></button></div><input type="range">';
    s.querySelector('span').textContent=label;
    const inp=s.querySelector('input');inp.min=mn;inp.max=mx;inp.step=st;
    const val=s.querySelector('.v');
    const show=()=>{val.textContent=Number(P[k]).toFixed(dec);val.classList.toggle('mod',Math.abs(P[k]-DEF[k])>1e-9);};
    inp.addEventListener('input',()=>{P[k]=parseFloat(inp.value);show();schedule();});
    val.addEventListener('click',()=>{P[k]=DEF[k];inp.value=P[k];show();schedule();});
    ui[k]={inp,show};pg.appendChild(s);
  }
  panel.appendChild(pg);pages.push({tb,pg});
  tb.addEventListener('click',()=>selTab(gi));
});
function selTab(i){pages.forEach((p,j)=>{p.pg.hidden=j!==i;p.tb.classList.toggle('on',j===i);});panel.scrollTop=0;}
selTab(0);
function syncUI(){for(const k in ui){ui[k].inp.value=P[k];ui[k].show();}}

// ----- pan / zoom -----
let tx=0,ty=0,zoom=1,k0=1;
const kNow=()=>k0*zoom;
function zoomMax(){return Math.max(1,Math.min(16,4/k0));}
function applyT(){
  if(!src)return;
  const vw=view.clientWidth,vh=view.clientHeight,k=kNow(),iw=src.w*k,ih=src.h*k;
  tx=iw<=vw?(vw-iw)/2:Math.min(0,Math.max(vw-iw,tx));
  ty=ih<=vh?(vh-ih)/2:Math.min(0,Math.max(vh-ih,ty));
  const t='translate('+tx+'px,'+ty+'px) scale('+k+')';
  cv.style.transform=t;ov.style.transform=t;
  if(mode==='heal'||Date.now()<ringUntil) drawOv();
}
function fitView(){
  if(!src)return;
  k0=Math.min(view.clientWidth/src.w,view.clientHeight/src.h);zoom=1;tx=ty=0;applyT();drawOv();
}
function zoomAt(px,py,ratio){
  const nz=Math.min(zoomMax(),Math.max(1,zoom*ratio)),r=nz/zoom;
  tx=px-(px-tx)*r;ty=py-(py-ty)*r;zoom=nz;applyT();
}
function drawOv(){
  if(!src)return;
  octx.clearRect(0,0,ov.width,ov.height);
  const k=kNow();octx.lineWidth=1.5/k;
  if(mode==='heal'){
    octx.strokeStyle='rgba(255,255,255,.9)';
    for(const s of spots){octx.beginPath();octx.arc(s.x*src.w,s.y*src.h,Math.max(s.r*src.w,2/k),0,6.2832);octx.stroke();}
  }
  if(Date.now()<ringUntil){
    const vw=view.clientWidth,vh=view.clientHeight;
    octx.strokeStyle='rgba(255,200,80,.95)';octx.beginPath();
    octx.arc((vw/2-tx)/k,(vh/2-ty)/k,healSize,0,6.2832);octx.stroke();
  }
}
const ptrs=new Map();
let g={moved:false,multi:false,t0:0,x0:0,y0:0,d0:0,mx:0,my:0};
const vpos=e=>{const r=view.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
view.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ui')&&e.target.closest('.ui').id!=='empty')return;
  if(!src)return;
  try{view.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,vpos(e));
  if(ptrs.size===1){g={moved:false,multi:false,t0:Date.now(),x0:e.clientX,y0:e.clientY};}
  else{
    g.multi=true;
    const a=[...ptrs.values()];
    g.d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;g.mx=(a[0].x+a[1].x)/2;g.my=(a[0].y+a[1].y)/2;
  }
});
view.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const n=vpos(e),dx=n.x-p.x,dy=n.y-p.y;
  p.x=n.x;p.y=n.y;
  if(ptrs.size===1){
    if(Math.hypot(e.clientX-g.x0,e.clientY-g.y0)>8)g.moved=true;
    if(g.moved){tx+=dx;ty+=dy;applyT();}
  }else if(ptrs.size===2){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    const mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    tx+=mx-g.mx;ty+=my-g.my;
    zoomAt(mx,my,d/g.d0);
    g.d0=d;g.mx=mx;g.my=my;
  }
});
const endP=e=>{
  if(!ptrs.has(e.pointerId))return;
  const single=ptrs.size===1;ptrs.delete(e.pointerId);
  if(single&&!g.moved&&!g.multi&&Date.now()-g.t0<600&&e.type==='pointerup')tap(e.clientX,e.clientY);
  if(ptrs.size===1)g.moved=true;
};
view.addEventListener('pointerup',endP);
view.addEventListener('pointercancel',endP);
view.addEventListener('wheel',e=>{if(!src)return;e.preventDefault();const p=vpos(e);zoomAt(p.x,p.y,e.deltaY<0?1.2:1/1.2);},{passive:false});
window.addEventListener('resize',()=>{if(zoom===1)fitView();else applyT();});

function tap(cx,cy){
  if(!src||mode==='view')return;
  const r=view.getBoundingClientRect(),k=kNow();
  const x=Math.round((cx-r.left-tx)/k),y=Math.round((cy-r.top-ty)/k);
  if(x<0||y<0||x>=src.w||y>=src.h)return;
  if(mode==='heal'){spots.push({x:x/src.w,y:y/src.h,r:healSize/src.w});updSpots();schedule();drawOv();}
  else if(mode==='pick')pickNeutral(x,y);
}

// ----- tools -----
for(const b of document.querySelectorAll('#modes button')){
  b.addEventListener('click',()=>{
    mode=b.dataset.m;
    for(const o of document.querySelectorAll('#modes button'))o.classList.toggle('on',o===b);
    $('healbar').hidden=mode!=='heal';
    drawOv();
    status(mode==='pick'?'Tap something that should be gray or white':mode==='heal'?'Zoom in, then tap a dust speck':'');
  });
}
$('hs').addEventListener('input',e=>{healSize=+e.target.value;ringUntil=Date.now()+900;drawOv();setTimeout(drawOv,950);});
$('hundo').onclick=()=>{spots.pop();updSpots();schedule();drawOv();};
$('hclr').onclick=()=>{spots=[];updSpots();schedule();drawOv();};
function updSpots(){$('hcount').textContent=spots.length;}
const bf=$('before');
const hold=v=>e=>{e.preventDefault();if(!src)return;showOrig=v;bf.classList.toggle('on',v);draw();};
bf.addEventListener('pointerdown',hold(true));
for(const ev of ['pointerup','pointerleave','pointercancel'])bf.addEventListener(ev,hold(false));
bf.addEventListener('contextmenu',e=>e.preventDefault());

// ----- rendering -----
let raf=0;
function resetExport(){outBlob=null;$('export').textContent='Export';}
function schedule(){
  resetExport();LS.set('ir570.last',P);
  if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;draw();});
}
function draw(){
  if(!src)return;
  const out=showOrig?src.data:render(src.data,src.w,src.h,P,spots);
  ctx.putImageData(new ImageData(new Uint8ClampedArray(out),src.w,src.h),0,0);
}

// ----- loading -----
async function loadFile(f){
  if(!f)return;
  status('Loading…');
  fileName=f.name||'photo.jpg';
  try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'});}
  catch(e){try{bmp=await createImageBitmap(f);}catch(e2){status('Could not read that image.');return;}}
  const sc=Math.min(1,BASE/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  cv.width=ov.width=w;cv.height=ov.height=h;
  ctx.drawImage(bmp,0,0,w,h);
  src={w,h,data:ctx.getImageData(0,0,w,h).data};
  spots=[];updSpots();resetExport();
  $('empty').hidden=true;cv.hidden=false;ov.hidden=false;$('export').disabled=false;
  fitView();draw();status(bmp.width+' × '+bmp.height);
}
$('file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value='';});

function pickNeutral(px,py){
  let base=src.data;
  if(P.dist!==0)base=distort(src.data,src.w,src.h,P.dist/100);
  let sr=0,sg=0,sb=0,n=0;
  for(let y=Math.max(0,py-4);y<=Math.min(src.h-1,py+4);y++)for(let x=Math.max(0,px-4);x<=Math.min(src.w-1,px+4);x++){
    const i=(y*src.w+x)*4;sr+=base[i];sg+=base[i+1];sb+=base[i+2];n++;
  }
  const [r,g2,b]=mixPx(P,sr/n,sg/n,sb/n);
  if(r<2||g2<2||b<2){status('Too dark to use as neutral');return;}
  const t=(r+g2+b)/3,cl=v=>Math.min(3,Math.max(.25,v));
  P.gR=cl(t/r);P.gG=cl(t/g2);P.gB=cl(t/b);P.temp=0;P.tint=0;
  syncUI();schedule();status('White balance set');
}

// ----- presets / sheet -----
const sel=$('presetSel');
function refreshPresets(selected){
  sel.innerHTML='';
  const add=(label,val)=>{const o=document.createElement('option');o.value=val;o.textContent=label;sel.appendChild(o);};
  add('Preset…','');
  for(const k in BUILTIN)add(k,'b:'+k);
  for(const k in user)add('★ '+k,'u:'+k);
  if(selected)sel.value=selected;
}
function applyPreset(obj){P=Object.assign({},DEF,obj);syncUI();schedule();}
sel.addEventListener('change',()=>{
  const v=sel.value;if(!v)return;
  const name=v.slice(2);applyPreset(v[0]==='b'?BUILTIN[name]:user[name]);
});
const sheet=$('sheet');
$('more').onclick=()=>{sheet.hidden=false;};
$('sclose').onclick=()=>{sheet.hidden=true;};
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true;});
$('preset0').onclick=()=>{applyPreset({});sel.value='';status('All sliders reset');sheet.hidden=true;};
$('psave').onclick=()=>{
  const n=$('pname').value.trim();if(!n){status('Type a name first');return;}
  if(BUILTIN[n]){status('That name is built in');return;}
  user[n]=Object.assign({},P);LS.set('ir570.presets',user);refreshPresets('u:'+n);sheet.hidden=true;status('Saved "'+n+'"');
};
$('pdel').onclick=()=>{
  const v=sel.value;
  if(v[0]!=='u'){status('Pick one of your ★ presets first');return;}
  delete user[v.slice(2)];LS.set('ir570.presets',user);refreshPresets();sheet.hidden=true;status('Deleted');
};
async function shareOrDownload(blob,name,type){
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000);
}
$('pexp').onclick=()=>{
  const data=JSON.stringify({presets:Object.assign({'Current':P},user)},null,1);
  shareOrDownload(new Blob([data],{type:'application/json'}),'s570-ir-presets.json','application/json');
};
$('pimp').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());let n=0;
    for(const k in (j.presets||{})){if(BUILTIN[k])continue;user[k]=Object.assign({},DEF,j.presets[k]);n++;}
    LS.set('ir570.presets',user);refreshPresets();sheet.hidden=true;status('Imported '+n);
  }catch(err){status('Not a preset file');}
});

// ----- export -----
$('export').addEventListener('click',async()=>{
  const btn=$('export');
  if(outBlob){await shareOrDownload(outBlob,outName,'image/jpeg');return;}
  if(!bmp)return;
  btn.disabled=true;btn.textContent='Working…';status('Processing full resolution…');
  await new Promise(r=>setTimeout(r,40));
  try{
    let W=bmp.width,H=bmp.height;
    if(W*H>16e6){const s=Math.sqrt(16e6/(W*H));W=Math.floor(W*s);H=Math.floor(H*s);}
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(bmp,0,0,W,H);
    const id=x.getImageData(0,0,W,H);
    const out=render(id.data,W,H,P,spots);
    x.putImageData(new ImageData(out,W,H),0,0);
    outBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));
    c.width=c.height=0;
    outName=fileName.replace(/\.[^.]+$/,'')+'_ir.jpg';
    btn.textContent='Save ✓';
    status('Done. Tap Save to share or save the JPG ('+Math.round(outBlob.size/1024)+' KB)');
  }catch(err){btn.textContent='Export';status('Export failed: '+err.message);}
  btn.disabled=false;
});

refreshPresets();syncUI();
</script>
</body>
</html>
